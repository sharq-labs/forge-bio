name: Spec Integrity

on:
  pull_request:
  push:
    branches:
      - main
      - "docs/**"

permissions:
  contents: read

jobs:
  spec-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install spec-test dependency
        run: python -m pip install "jsonschema>=4.23,<5"
      - name: Validate scientific specs
        run: python scripts/check_specs.py
      - name: Execute schema contracts
        run: python -m unittest discover -s tests/spec -p "test_*.py" -v
